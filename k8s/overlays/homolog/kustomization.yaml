apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina

resources:
  - ../../base

patches:
  # Sem patch de replicas: o HPA decide (min 1 / max 3, patch abaixo).
  - path: patch-recursos.yaml

  - target:
      kind: ConfigMap
      name: oficina-config
    patch: |-
      - op: add
        path: /data/SPRING_PROFILES_ACTIVE
        value: homolog
      # Usado pelo logback-spring.xml (customFields.environment) nos logs JSON
      # estruturados — sem esta chave, todo log de homolog/prod saía marcado
      # "unknown" (nenhum manifesto definia ENVIRONMENT).
      - op: add
        path: /data/ENVIRONMENT
        value: homolog

  - target:
      kind: HorizontalPodAutoscaler
      name: oficina-api
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 3
