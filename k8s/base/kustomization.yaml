apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: oficina

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml

# Sem entrada `images:` estatica de proposito. O CD (cd.yml) roda
# `kustomize edit set image` na pasta do overlay, com a tag sha-<commit>,
# ANTES de um unico `kustomize build | kubectl apply -f -`. Assim nenhum
# rollout acontece com imagem de exemplo.
