name: CI - Build & Test

# Equivalente ao .github/workflows/ci.yml da raiz do monorepo, mas com
# caminhos relativos a raiz DESTE repositorio (soat-oficina-api) - depois do
# split (scripts/split-repos.sh, ADR-0004) a aplicacao passa a ocupar a raiz
# do proprio repositorio, entao "working-directory: oficina-api" e
# "path: oficina-api/..." (corretos no monorepo) deixam de existir aqui. So
# ativa depois do split: dentro do monorepo quem roda e o par de workflows da
# raiz.

on:
  push:
    # main e homolog: as duas branches que disparam CD neste repositorio
    # (cd.yml) e as duas cobertas pelos outros tres repositorios da Fase 3.
    branches: [main, homolog]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn verify --batch-mode --no-transfer-progress -s settings.xml

      # Renderiza o overlay de homolog: falha se um patch apontar para um
      # alvo inexistente ou se o YAML gerado for invalido. Fica neste job
      # porque build-and-test e o check obrigatorio.
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0

      - name: Validar manifestos (kustomize)
        run: kubectl kustomize k8s/overlays/homolog > /dev/null

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  owasp:
    name: owasp
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Aviso sem chave NVD
        if: env.NVD_API_KEY == ''
        run: 'echo "NVD_API_KEY ausente: OWASP pulado"'

      - uses: actions/checkout@v4
        if: env.NVD_API_KEY != ''

      - name: Set up Java 21
        if: env.NVD_API_KEY != ''
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Semana do cache NVD
        if: env.NVD_API_KEY != ''
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Restaurar cache dos dados NVD
        if: env.NVD_API_KEY != ''
        id: nvd-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ steps.week.outputs.week }}
          restore-keys: nvd-

      - name: OWASP dependency-check
        if: env.NVD_API_KEY != ''
        run: >
          mvn -B --no-transfer-progress -s settings.xml
          org.owasp:dependency-check-maven:check
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY

      - name: Salvar cache dos dados NVD
        if: always() && env.NVD_API_KEY != '' && steps.nvd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ steps.week.outputs.week }}

      - name: Upload relatorio OWASP
        if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: target/dependency-check/
          retention-days: 7

  terraform:
    name: Terraform fmt e validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
