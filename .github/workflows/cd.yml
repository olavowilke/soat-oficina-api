name: CD - Build image & Deploy (oficina-api)

# Esta pipeline e dona do deploy da oficina-api (Fase 4): terraform (fila da
# saga e role do pod), build e push da imagem no ECR, Namespace, Secret
# oficina-secrets, manifestos (k8s/) e rollout. Os manifestos antes viviam em
# soat-infra-k8s; la ficou so a infraestrutura (cluster, rede, NLB, ECR).
#
# Ordem entre stacks: infra-k8s -> infra-database -> lambda-auth -> aplicacao.
# Todos os parametros SSM que esta pipeline le vem das outras stacks (ADR-0005).
#
# Secrets do GitHub Actions deste repositorio: AWS_DEPLOY_ROLE_ARN,
# TF_STATE_BUCKET, TF_LOCK_TABLE, ADMIN_USERNAME, ADMIN_PASSWORD,
# MAIL_USERNAME, MAIL_PASSWORD, NEW_RELIC_LICENSE_KEY.
# Variaveis: DEPLOY_HOMOLOG (deve ser "true"), AWS_REGION (opcional).
#   main -> ambiente homolog
# A variavel de repositorio DEPLOY_HOMOLOG controla o deploy: so roda se for "true".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ambiente:
        description: Ambiente alvo
        required: true
        default: homolog
        type: choice
        options: [homolog]

permissions:
  id-token: write # OIDC para assumir a role na AWS, sem chave estatica
  contents: read

# Um deploy por vez no homolog; um deploy em andamento nunca e cancelado.
concurrency:
  group: cd-homolog
  cancel-in-progress: false

jobs:
  # Fila de respostas da saga e role do pod (Pod Identity). Roda antes do
  # build: o pod novo precisa da role e da fila ja existentes ao subir.
  terraform:
    if: vars.DEPLOY_HOMOLOG == 'true'
    name: terraform apply (fila da saga + role do pod)
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AMBIENTE: homolog
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina-api/${AMBIENTE}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve -var-file=environments/${AMBIENTE}.tfvars

  build-and-deploy:
    needs: terraform
    if: vars.DEPLOY_HOMOLOG == 'true'
    name: Build & push ECR + kubectl apply
    runs-on: ubuntu-latest
    environment: homolog
    env:
      AMBIENTE: homolog
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      KUSTOMIZE_VERSION: v5.5.0
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      # O repositorio ECR e provisionado por infra-k8s/terraform/ecr.tf. Esta
      # pipeline so le a URL publicada em SSM.
      - name: Ler URL do repositorio ECR (SSM)
        id: ecr
        run: |
          REPO_URL="$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/registry/repository-url" --query 'Parameter.Value' --output text)"
          echo "repository_url=$REPO_URL" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.repository_url }}:sha-${{ github.sha }}
            ${{ steps.ecr.outputs.repository_url }}:${{ env.AMBIENTE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # O nome do cluster vem do SSM (contrato ADR-0005), publicado por infra-k8s.
      - name: aws eks update-kubeconfig
        run: |
          CLUSTER_NAME="$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/cluster/name" --query 'Parameter.Value' --output text)"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      # O Namespace e o Secret existem ANTES do Deployment. O Secret nunca e
      # versionado: a pipeline o monta a partir do SSM (host/porta/nome do
      # banco, ARN dos segredos) e do Secrets Manager (credenciais do banco e
      # segredo JWT). Os demais valores vem de Secrets do GitHub Actions, via
      # `env:` (nunca interpolados no script).
      #
      # infra-database e lambda-auth aplicam antes desta pipeline. Qualquer
      # erro de leitura no SSM ou no Secrets Manager (parametro ausente,
      # AccessDenied, throttling) e fatal: o passo imprime o erro e falha.
      - name: Criar Namespace e Secret oficina-secrets
        env:
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
        run: |
          set -euo pipefail
          SSM_BASE="/oficina/${AMBIENTE}"

          kubectl create namespace oficina --dry-run=client -o yaml | kubectl apply -f -

          ler_param() {
            local valor
            if ! valor="$(aws ssm get-parameter --name "$1" --query 'Parameter.Value' --output text 2>/tmp/ssm-param.err)"; then
              echo "ERRO: falha ao ler o parametro SSM $1:" >&2
              cat /tmp/ssm-param.err >&2
              exit 1
            fi
            printf '%s' "$valor"
          }

          DB_HOST="$(ler_param "${SSM_BASE}/database/host")"
          DB_PORT="$(ler_param "${SSM_BASE}/database/port")"
          DB_NAME="$(ler_param "${SSM_BASE}/database/name")"
          DB_SECRET_ARN="$(ler_param "${SSM_BASE}/database/secret-arn")"
          JWT_SECRET_ARN="$(ler_param "${SSM_BASE}/auth/jwt-secret-arn")"

          DB_CREDS="$(aws secretsmanager get-secret-value --secret-id "$DB_SECRET_ARN" --query 'SecretString' --output text)"
          DB_USERNAME="$(echo "$DB_CREDS" | jq -r '.username')"
          DB_PASSWORD="$(echo "$DB_CREDS" | jq -r '.password')"
          JWT_SECRET="$(aws secretsmanager get-secret-value --secret-id "$JWT_SECRET_ARN" --query 'SecretString' --output text)"

          DB_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"

          # As credenciais do administrador sao escolha de quem opera o
          # ambiente. Sem elas a aplicacao usaria o padrao publico de
          # application.yml (admin/admin123) e SegredosPadraoValidator
          # recusaria subir. Abortamos aqui, com mensagem clara.
          if [ -z "${ADMIN_USERNAME}" ] || [ -z "${ADMIN_PASSWORD}" ]; then
            echo "ERRO: defina os secrets ADMIN_USERNAME e ADMIN_PASSWORD neste repositorio." >&2
            echo "ERRO: sem eles a aplicacao subiria com a senha de exemplo publicada no repositorio." >&2
            exit 1
          fi

          kubectl create secret generic oficina-secrets \
            --namespace oficina \
            --from-literal=DB_URL="${DB_URL}" \
            --from-literal=DB_USERNAME="${DB_USERNAME}" \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --from-literal=ADMIN_USERNAME="${ADMIN_USERNAME}" \
            --from-literal=ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            --from-literal=MAIL_USERNAME="${MAIL_USERNAME}" \
            --from-literal=MAIL_PASSWORD="${MAIL_PASSWORD}" \
            --from-literal=NEW_RELIC_LICENSE_KEY="${NEW_RELIC_LICENSE_KEY}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set up kustomize
        run: |
          curl -sLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/kustomize
          kustomize version

      # Tag imutavel sha-<commit> (rastreabilidade e rollback). O `edit set
      # image` roda ANTES do unico apply: o Deployment nasce e muda sempre
      # com a imagem real, sem rollout de imagem de exemplo.
      - name: kubectl apply (manifestos + imagem)
        working-directory: k8s/overlays/homolog
        run: |
          kustomize edit set image "oficina-api=${{ steps.ecr.outputs.repository_url }}:sha-${{ github.sha }}"
          kustomize build . | kubectl apply -f -

      - name: kubectl rollout status
        run: kubectl -n oficina rollout status deploy/oficina-api --timeout=300s

      # Smoke test pelo endpoint publico (API Gateway), lido do SSM
      # (publicado por lambda-auth): API Gateway -> VPC Link -> NLB -> Service -> pod.
      - name: Smoke test (health via API Gateway)
        run: |
          API_ENDPOINT="$(aws ssm get-parameter --name "/oficina/${AMBIENTE}/gateway/endpoint" --query 'Parameter.Value' --output text)"
          curl -sf "${API_ENDPOINT%/}/api/actuator/health"
